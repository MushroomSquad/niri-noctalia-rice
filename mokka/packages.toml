# Single package manifest; base sets are always selected by the installer.
# Bootstrap-only exceptions in install.sh: python, cachy-update, libnotify and paru.

[[set]]
id = "core"
title = "Base desktop system"
group = "base"
default = false
repo = ["python", "git", "niri", "noctalia", "cachyos-niri-noctalia", "wezterm", "xwayland-satellite", "xdg-desktop-portal-gnome", "xdg-desktop-portal-gtk", "gnome-keyring", "wl-clipboard", "curl", "base-devel", "noto-fonts", "noto-fonts-emoji", "adwaita-fonts"]
aur = []

[[set]]
id = "shell"
title = "Fish shell and terminal tools"
group = "base"
default = false
repo = ["fish", "fisher", "starship", "eza", "bat", "fastfetch", "ugrep", "direnv"]
aur = []

[[set]]
id = "gtk-theme"
title = "GTK themes"
group = "theme"
default = true
repo = ["adw-gtk-theme", "catppuccin-gtk-theme-mocha"]
aur = []

[[set]]
id = "fonts"
title = "Inter and JetBrainsMono Nerd fonts"
group = "theme"
default = true
repo = ["inter-font", "ttf-jetbrains-mono-nerd"]
aur = []

[[set]]
id = "icons"
title = "Tela Circle Dracula icons"
group = "theme"
default = true
repo = []
aur = ["tela-circle-icon-theme-dracula"]

[[set]]
id = "qt-theme"
title = "Qt via Kvantum and qt6ct"
group = "theme"
default = true
repo = ["kvantum"]
aur = ["qt6ct-kde"]

[[set]]
id = "cursors"
title = "Catppuccin Mocha cursors"
group = "theme"
default = true
repo = []
aur = ["catppuccin-cursors-mocha"]

[[set]]
id = "sassc"
title = "Sass compiler for Colloid"
group = "theme"
default = false
repo = ["sassc"]
aur = []

[[set]]
id = "greeter"
title = "greetd and ReGreet login screen"
group = "apps"
default = true
repo = ["greetd", "greetd-regreet", "plymouth"]
aur = []
step = "greeter"
installed_if = { unit = "greetd.service" }

[[set]]
id = "handy"
title = "Handy speech-to-text"
group = "apps"
default = true
repo = ["fuse2", "wtype", "xdotool"]
aur = []
step = "handy"
installed_if = { file = ["~/.local/opt/handy/Handy.AppImage", "~/.config/autostart/Handy.desktop"] }

[[set]]
id = "firedragon"
title = "FireDragon browser"
group = "apps"
default = true
repo = []
aur = ["firedragon-catppuccin-bin"]
step = "firedragon"
step_always = true
any_of = [["firedragon-catppuccin-bin", "firedragon"]]

[[set]]
id = "nvim"
title = "Neovim and AstroNvim dependencies"
group = "apps"
default = true
repo = ["neovim", "git", "ripgrep", "fd", "lazygit", "tree-sitter-cli", "unzip"]
aur = []
cmds = { tree-sitter-cli = "tree-sitter" }
removable = true

[[set]]
id = "micro"
title = "Micro editor"
group = "apps"
default = true
repo = ["micro"]
aur = []
removable = true

[[set]]
id = "telegram"
title = "Telegram and WebSocket proxy"
group = "apps"
default = true
repo = ["telegram-desktop"]
aur = ["tg-ws-proxy-bin"]
cmds = { tg-ws-proxy-bin = "tg-ws-proxy" }
removable = true

[[set]]
id = "filezilla"
title = "FileZilla"
group = "apps"
default = true
repo = ["filezilla"]
aur = []
removable = true

[[set]]
id = "clash-verge"
title = "Clash Verge Rev"
group = "apps"
default = true
repo = []
aur = ["clash-verge-rev-bin"]
any_of = [["clash-verge-rev-bin", "clash-verge-rev"]]
removable = true

[[set]]
id = "spotify"
title = "Spotify launcher"
group = "apps"
default = true
repo = []
aur = ["spotify-launcher"]
removable = true

[[set]]
id = "dev"
title = "Development and rootless containers"
group = "dev"
default = true
repo = ["nodejs", "npm", "openssh", "k9s", "podman", "podman-compose", "passt", "fuse-overlayfs"]
aur = []
step = "podman"
step_always = true
