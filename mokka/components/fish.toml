id = "fish"
title = "Garuda fish configuration"
group = "shell"
default = true
sources = ["garuda-fish-config", "done"]
needs = ["shell"]

[[steps]]
op = "copy"
src = "garuda-fish-config:config.fish"
dst = ".config/fish/config.fish"

[[steps]]
op = "drop_lines"
target = ".config/fish/config.fish"
pattern = "^\\s*alias\\s+(?:upd|fixpacman|rmpkg|mirror\\S*|grubup)\\s"

[[steps]]
op = "replace"
target = ".config/fish/config.fish"
pattern = "(?<=')eza\\b"
repl = "eza --icons --color=always"

[[steps]]
op = "replace"
target = ".config/fish/config.fish"
pattern = '\Z'
repl = '''

# User overrides: keep this block last.
if test -f "$HOME/.config/rice-custom/starship.toml"
    set -gx STARSHIP_CONFIG "$HOME/.config/rice-custom/starship.toml"
end
for custom_file in (printf '%s\n' "$HOME"/.config/rice-custom/fish/*.fish | sort)
    source "$custom_file"
end

# As in Garuda's stub.fish: fastfetch at the very bottom, after customizations.
__garuda_fastfetch
'''

# __garuda_fastfetch looks for presets in /usr/share; ours is the rice-installed ~/.config/fastfetch/config.jsonc
[[steps]]
op = "replace"
target = ".config/fish/config.fish"
pattern = 'test -f /usr/share/fastfetch/presets/mokka\.jsonc'
repl = 'test -f "$HOME/.config/fastfetch/config.jsonc"'

[[steps]]
op = "replace"
target = ".config/fish/config.fish"
pattern = 'fastfetch --config mokka\.jsonc'
repl = 'fastfetch'

[[steps]]
op = "copy"
src = "done:done.fish"
dst = ".config/fish/conf.d/"
