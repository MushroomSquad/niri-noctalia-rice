id = "agents"
title = "Claude Code and Codex agents (GSD)"
group = "apps"
default = true

[[steps]]
op = "copy"
src = "repo:agents/claude"
dst = ".claude/agents"

[[steps]]
op = "copy"
src = "repo:agents/codex"
dst = ".codex/agents"

[[steps]]
op = "replace"
target = ".codex/agents/gsd-debugger.toml"
pattern = "@HOME@"
repl = "$HOME"

