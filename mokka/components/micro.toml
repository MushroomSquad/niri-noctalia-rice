id = "micro"
title = "Catppuccin Mocha for micro"
group = "terminal"
previews = ["catppuccin-micro:assets/mocha.webp"]
default = true
needs = ["micro"]

[[steps]]
op = "copy"
src = "catppuccin-micro:themes/catppuccin-mocha.micro"
dst = ".config/micro/colorschemes/"

[[steps]]
op = "json_set"
target = ".config/micro/settings.json"
key = "colorscheme"
value = "catppuccin-mocha"
