id = "nvim"
title = "Neovim + AstroNvim"
group = "apps"
default = true
[packages]
repo = ["neovim", "git", "ripgrep", "fd", "lazygit", "tree-sitter-cli", "unzip"]

[[steps]]
op = "copy"
src = "repo:nvim"
dst = ".config/nvim"

# lazy.nvim rewrites this lock; the second copy makes it a seed.

[[steps]]
op = "copy"
src = "repo:nvim/lazy-lock.json"
dst = ".config/nvim/lazy-lock.json"
track = false

# Noctalia's neovim template regenerates this on every theme change; seed only.

[[steps]]
op = "copy"
src = "repo:nvim/lua/matugen.lua"
dst = ".config/nvim/lua/matugen.lua"
track = false
